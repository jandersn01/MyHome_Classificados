# Configuracoes do Sistema MyHome Classificados
# RF07 - Configuracao Centralizada (Singleton)

# Taxa de comissao sobre vendas (0.05 = 5%)
taxa.comissao=0.05

# Limite maximo de fotos por anuncio
limite.upload.fotos=10

# Termos proibidos nos anuncios (separados por virgula)
termos.proibidos=spam,fraude,golpe,falso,enganacao,piramide

# Validacao de descricao
descricao.tamanho.minimo=20

# Validacao de preco
preco.minimo=1000
preco.maximo=100000000

# Quantidade minima de fotos
fotos.minimo=1

# Configuracoes de Email (SMTP)
email.smtp.host=smtp.gmail.com
email.smtp.port=587
email.smtp.auth=true
email.smtp.starttls=true
# Preencha com suas credenciais para envio real
email.usuario=
email.senha=

# Configuracoes de Log
log.arquivo=logs/sistema.log
log.nivel=INFO
